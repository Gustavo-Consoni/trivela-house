<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Produto · Catálogo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre sua próxima chuteira">
    <link rel="stylesheet" href="../src/output.css">
    <script src="../src/catalogo.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
    <style>
        html {
            text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            font-size: clamp(12px, 4vw, 16px);
        }
        [x-cloak] {
            display: none !important;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
    </style>
</head>
<body
    class="bg-[#101010] min-h-screen font-sans text-white antialiased"
    x-data="produto"
    @keydown.window.arrow-left="mostrar(atual - 1)"
    @keydown.window.arrow-right="mostrar(atual + 1)"
>
    <!-- Fundo: blobs azuis desfocados -->
    <div class="-z-10 fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="-top-32 -left-32 absolute bg-blue-600/35 blur-[128px] rounded-full size-128 motion-safe:animate-flutuar"></div>
        <div class="top-1/3 -right-32 absolute bg-sky-500/20 blur-[128px] rounded-full size-128 motion-safe:animate-flutuar [animation-delay:-8s]"></div>
        <div class="-bottom-32 left-1/4 absolute bg-indigo-600/30 blur-[140px] rounded-full size-128 motion-safe:animate-flutuar [animation-delay:-16s]"></div>
    </div>

    <header class="top-0 z-20 sticky bg-white/5 backdrop-blur-xl backdrop-saturate-150 border-white/15 border-b">
        <div class="flex items-center gap-4 mx-auto px-4 sm:px-8 py-4 max-w-7xl">
            <a class="font-bold text-lg tracking-tight" href="../">Catálogo</a>
            <a class="inline-flex items-center gap-1 ml-auto text-white/60 hover:text-white text-sm transition" href="../" @click="voltar($event)">
                <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.83 10l3.94 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd"/>
                </svg>
                Voltar para a listagem
            </a>
        </div>
    </header>

    <main class="mx-auto px-4 sm:px-8 py-8 max-w-7xl">
        <p class="py-32 text-white/50 text-center" x-show="carregando">Carregando produto…</p>

        <div class="bg-red-500/10 backdrop-blur-xl backdrop-saturate-150 p-8 border border-red-400/30 rounded-2xl text-red-200 text-sm" x-cloak x-show="erro">
            <p class="font-semibold" x-text="erro"></p>
            <p class="mt-2">
                <a class="underline" href="../">Voltar para a listagem</a>
            </p>
        </div>

        <template x-if="p">
            <div>
                <article class="gap-8 lg:gap-16 grid lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)]">
                    <!-- Galeria -->
                    <section class="lg:top-16 lg:sticky lg:self-start" aria-label="Fotos">
                        <div class="relative rounded-3xl aspect-square overflow-hidden vidro">
                            <img
                                class="size-full object-contain"
                                :src="fotos[atual]"
                                :alt="p.titulo"
                                loading="lazy"
                            >
                            <template x-if="fotos.length > 1">
                                <div>
                                    <button
                                        class="top-1/2 left-4 absolute place-items-center grid bg-black/30 hover:bg-black/50 rounded-full size-8 text-white transition -translate-y-1/2 cursor-pointer vidro"
                                        type="button"
                                        @click="mostrar(atual - 1)"
                                        aria-label="Foto anterior"
                                    >
                                        <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                            <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.83 10l3.94 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd"/>
                                        </svg>
                                    </button>
                                    <button
                                        class="top-1/2 right-4 absolute place-items-center grid bg-black/30 hover:bg-black/50 rounded-full size-8 text-white transition -translate-y-1/2 cursor-pointer vidro"
                                        type="button"
                                        @click="mostrar(atual + 1)"
                                        aria-label="Próxima foto"
                                    >
                                        <svg class="size-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 0 1 .02-1.06L11.17 10 7.23 6.29a.75.75 0 1 1 1.04-1.08l4.5 4.25a.75.75 0 0 1 0 1.08l-4.5 4.25a.75.75 0 0 1-1.06-.02Z" clip-rule="evenodd"/>
                                        </svg>
                                    </button>
                                    <span class="right-4 bottom-4 absolute bg-black/60 backdrop-blur px-2 py-1 rounded-full font-medium text-white text-xs" x-text="`${atual + 1} / ${fotos.length}`"></span>
                                </div>
                            </template>
                        </div>
                        <div class="flex gap-2 mt-4 p-1 overflow-x-auto" x-ref="miniaturas">
                            <template x-for="(src, n) in fotos" :key="n">
                                <button
                                    class="rounded-xl size-16 overflow-hidden transition cursor-pointer vidro shrink-0"
                                    :class="n === atual ? 'ring-2 ring-blue-400' : 'opacity-50 hover:opacity-100'"
                                    type="button"
                                    @click="mostrar(n)"
                                >
                                    <img
                                        class="size-full object-cover"
                                        :src="src"
                                        :alt="`Foto ${n + 1}`"
                                        loading="lazy"
                                    >
                                </button>
                            </template>
                        </div>
                    </section>

                    <!-- Informações -->
                    <section class="space-y-8">
                        <div>
                            <p class="font-semibold text-blue-300/80 text-xs uppercase tracking-wider" x-text="p.marca"></p>
                            <h1 class="mt-1 font-bold text-2xl sm:text-3xl leading-tight" x-text="p.titulo"></h1>
                            <p class="mt-4 font-bold text-3xl" :class="p.preco == null && 'text-white/40'" x-text="formatarPreco(p.preco)"></p>
                        </div>

                        <div x-show="tamanhos.length">
                            <h2 class="mb-2 font-semibold text-white/70 text-sm">Tamanhos disponíveis</h2>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="t in tamanhos" :key="t">
                                    <span class="place-items-center grid px-4 rounded-xl min-w-8 h-8 font-medium text-sm vidro" x-text="t"></span>
                                </template>
                            </div>
                        </div>

                        <dl class="rounded-2xl divide-y divide-white/10 text-sm vidro" x-show="p.solado || p.codigo">
                            <div class="flex justify-between gap-4 px-4 py-4" x-show="p.solado">
                                <dt class="text-white/50">Solado</dt>
                                <dd class="font-medium" x-text="p.solado"></dd>
                            </div>
                            <div class="flex justify-between gap-4 px-4 py-4" x-show="p.codigo">
                                <dt class="text-white/50">Código</dt>
                                <dd class="font-mono" x-text="p.codigo"></dd>
                            </div>
                        </dl>
                    </section>
                </article>

                <section class="mt-16" x-show="relacionados.length">
                    <h2 class="mb-4 font-bold text-lg">Da mesma marca</h2>
                    <div class="gap-2 sm:gap-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6">
                        <template x-for="o in relacionados" :key="o.id">
                            <a class="group hover:bg-white/10 hover:border-white/30 rounded-2xl overflow-hidden transition hover:-translate-y-0.5 vidro" :href="urlProduto(o.id)">
                                <div class="bg-white/5 aspect-square overflow-hidden">
                                    <img
                                        class="size-full object-cover group-hover:scale-105 transition duration-300"
                                        :src="urlFoto(o.arquivos[0])"
                                        :alt="o.titulo"
                                        loading="lazy"
                                    >
                                </div>
                                <div class="p-4">
                                    <h3 class="font-medium text-white/90 text-xs line-clamp-2" x-text="o.titulo"></h3>
                                    <p class="mt-1 font-bold text-sm" x-text="formatarPreco(o.preco)"></p>
                                </div>
                            </a>
                        </template>
                    </div>
                </section>
            </div>
        </template>
    </main>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('produto', () => ({

            p: null,
            relacionados: [],
            atual: 0,
            carregando: true,
            erro: '',

            async init() {
                const id = new URLSearchParams(location.search).get('id')
                try {
                    if (!id) throw new Error('Nenhum produto informado.')
                    const todos = await carregarProdutos()
                    this.p = todos.find((o) => o.id === id)
                    if (!this.p) throw new Error(`Produto ${id} não encontrado.`)
                    this.relacionados = todos.filter((o) => o.id !== id && o.marca === this.p.marca).slice(0, 6)
                    document.title = `${this.p.titulo} · Catálogo`
                } catch (e) {
                    this.erro = e.message
                } finally {
                    this.carregando = false
                }
            },

            get fotos() { return this.p ? this.p.arquivos.map(urlFoto) : [] },

            get tamanhos() {
                const t = this.p?.tamanhos
                return t ? Array.from({ length: t.ate - t.de + 1 }, (_, i) => t.de + i) : []
            },

            mostrar(i) {
                if (!this.fotos.length) return
                this.atual = (i + this.fotos.length) % this.fotos.length
                this.$nextTick(() => this.$refs.miniaturas?.children[this.atual]?.scrollIntoView({ block: 'nearest', inline: 'nearest' }))
            },

            // Se veio da listagem, volta pelo histórico para manter busca/filtros/rolagem.
            voltar(e) {
                const listagem = new URL('../', location.href).pathname
                if (document.referrer && new URL(document.referrer).pathname === listagem) {
                    e.preventDefault()
                    history.back()
                }
            },

        }))
    })
    </script>
</body>
</html>
